# Ceny scrolli (pricetrack) jako strona statyczna na hoscie rimhaven, obok
# kalkulatora DPM. Wgrywa ja publish.py --nginx do
# /etc/nginx/sites-available/osmsfm.
#
# Domena: osmsfm.duckdns.org (DuckDNS, rekord A ma wskazywac 167.233.209.152).
# TLS dokłada certbot --nginx -d osmsfm.duckdns.org, tak jak przy maple.
# Uwaga: po kazdym ruchu certbota sciagnac te konfiguracje z powrotem:
#   scp rimhaven:/etc/nginx/sites-available/osmsfm server/osmsfm.nginx.conf
# inaczej publish.py --nginx nadpisze ja wersja bez TLS.
#
# Ten blok na porcie 80 musi istniec z wlasnym server_name, bo blok maple jest
# default_server i przekierowuje kazdy obcy host na maple-dps; bez tego bloku
# wyzwanie HTTP-01 certbota dla osmsfm trafiloby w tamto przekierowanie.

server {
    server_name osmsfm.duckdns.org;

    root /var/www/osmsfm;
    index index.html;

    # data.json to kilkaset KB tekstu, gzip zbija je kilkukrotnie.
    gzip on;
    gzip_types application/json;  # text/html nginx gzipuje zawsze, wpisanie go daje warn
    gzip_min_length 1024;

    # Publikacja podmienia data.json bez zmiany nazwy, wiec przegladarka ma
    # pytac o swiezosc przy kazdym wejsciu. Wycinki sie nie zmieniaja.
    add_header Cache-Control "no-cache";
    location /crops/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Odbiornik obserwacji (pricetrack/server/ingest.py, systemd osmsfm-ingest).
    # Paczka to do 150 wierszy z wycinkami PNG w base64, kilka MB.
    location /api/ {
        proxy_pass http://127.0.0.1:8781;
        proxy_read_timeout 120s;
        client_max_body_size 48m;
    }

    access_log /var/log/nginx/osmsfm.access.log;
    error_log  /var/log/nginx/osmsfm.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osmsfm.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osmsfm.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = osmsfm.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name osmsfm.duckdns.org;
    return 404; # managed by Certbot


}