# Scroll prices (pricetrack) as a static site on the rimhaven host, next to
# the DPM calculator. Uploaded by publish.py --nginx to
# /etc/nginx/sites-available/osmsfm.
#
# Domain: osmsfm.duckdns.org (DuckDNS, the A record must point at 167.233.209.152).
# TLS is added by certbot --nginx -d osmsfm.duckdns.org, the same way as for maple.
# Note: after every certbot run pull this configuration back:
#   scp rimhaven:/etc/nginx/sites-available/osmsfm server/osmsfm.nginx.conf
# otherwise publish.py --nginx overwrites it with the version without TLS.
#
# This block on port 80 must exist with its own server_name, because the maple block is
# default_server and redirects every foreign host to maple-dps; without this block
# certbot's HTTP-01 challenge for osmsfm would land in that redirect.

# Request limits for the receiver, per address. Zones must sit at http level, which is where
# sites-enabled files are included. An upload is one request per batch of 150 rows, a first-time
# seed of a few thousand rows is a few dozen of them back to back: those queue up (burst) instead
# of failing. Registration happens once per tracker; ingest.py also caps it at 5 a day per address.
limit_req_zone $binary_remote_addr zone=osmsfm_api:1m rate=60r/m;
limit_req_zone $binary_remote_addr zone=osmsfm_reg:1m rate=2r/m;

server {
    server_name osmsfm.duckdns.org;

    root /var/www/osmsfm;
    index index.html;
    limit_req_status 429;

    # data.json is a few hundred KB of text, gzip shrinks it several times over.
    gzip on;
    gzip_types application/json;  # nginx always gzips text/html, listing it gives a warning
    gzip_min_length 1024;

    # Publishing replaces data.json without changing its name, so the browser must
    # ask for freshness on every visit. Crops never change.
    add_header Cache-Control "no-cache";
    location /crops/ {
        add_header Cache-Control "public, max-age=2592000";
    }

    location / {
        try_files $uri $uri/ =404;
    }

    # Observation receiver (server/ingest.py, systemd osmsfm-ingest).
    # A batch is up to 150 rows with PNG crops in base64, a few MB.
    location /api/ {
        limit_req zone=osmsfm_api burst=40;
        proxy_pass http://127.0.0.1:8781;
        proxy_set_header X-Real-IP $remote_addr;  # ingest.py keys its registration cap and bans on it
        proxy_read_timeout 120s;
        client_max_body_size 48m;
    }
    location = /api/register {
        limit_req zone=osmsfm_reg burst=3 nodelay;
        proxy_pass http://127.0.0.1:8781;
        proxy_set_header X-Real-IP $remote_addr;
        client_max_body_size 8k;
    }

    access_log /var/log/nginx/osmsfm.access.log;
    error_log  /var/log/nginx/osmsfm.error.log;

    listen [::]:443 ssl; # managed by Certbot
    listen 443 ssl; # managed by Certbot
    ssl_certificate /etc/letsencrypt/live/osmsfm.duckdns.org/fullchain.pem; # managed by Certbot
    ssl_certificate_key /etc/letsencrypt/live/osmsfm.duckdns.org/privkey.pem; # managed by Certbot
    include /etc/letsencrypt/options-ssl-nginx.conf; # managed by Certbot
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem; # managed by Certbot

}


server {
    if ($host = osmsfm.duckdns.org) {
        return 301 https://$host$request_uri;
    } # managed by Certbot


    listen 80;
    listen [::]:80;
    server_name osmsfm.duckdns.org;
    return 404; # managed by Certbot


}